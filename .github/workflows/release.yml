name: Release to PyPI & GitHub

# Bump `version` in python/pyproject.toml, push, then run this from the Actions tab.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    environment: pypi
    permissions:
      contents: write  # tag + GitHub release
      id-token: write  # PyPI trusted publishing, no API token stored

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Test
        run: |
          uv run --no-project --python 3.10 --with httpx python test_whatsapp_sdk.py
          uv run --no-project --python 3.13 --with httpx python test_whatsapp_sdk.py

      - name: Build
        run: uv build

      - name: Read version
        id: version
        run: echo "VERSION=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        run: uv publish

      - name: Tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: python-v${{ steps.version.outputs.VERSION }}
          name: Python v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            python/dist/*.whl
            python/dist/*.tar.gz
