[project]
name = "openping-whatsapp"
version = "0.2.0"
description = "Async Python client for the WhatsApp Business Platform (Meta Cloud API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.0"]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenPing" }]
keywords = ["whatsapp", "whatsapp-cloud-api", "meta", "graph-api", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

[project.urls]
Repository = "https://github.com/Ruki111/whatsApp-sdk"
Issues = "https://github.com/Ruki111/whatsApp-sdk/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_sdk"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE"]
