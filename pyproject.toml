[project]
name = "whatsapp-sdk"
version = "0.1.0"
description = "Async client for the WhatsApp Cloud API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["whatsapp_sdk.py"]
